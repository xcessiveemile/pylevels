<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyLevels</title>
  <meta name="description" content="Learn Python by typing code, level by level. 72 levels, 36 drills, an AI tutor that never gives the answer. Runs in your browser.">
  <meta property="og:title" content="PyLevels">
  <meta property="og:description" content="Learn Python by typing code, level by level. 72 levels, 36 drills, an AI tutor that never gives the answer. Runs in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/og.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
  <link rel="stylesheet" href="style.css?v=1790476078">
</head>
<body>
  <!-- backgrounds: real footage for the sea and for space -->
  <div class="backdrop">
    <video id="video-sea" autoplay muted loop playsinline preload="auto" src="media/scene.mp4?v=2"></video>
    <video id="video-space" muted loop playsinline preload="none" src="media/space.mp4?v=2"></video>
    <div class="veil"></div>
    <div class="tint"></div>
  </div>

  <div class="frame">
    <div class="glass">
      <div class="status" id="status"></div>
      <div class="screen" id="screen"></div>
      <div class="buttons" id="buttons"></div>
    </div>
    <div class="dock">
      <div class="xp" id="xp">
        <div class="name"><b id="xp-name">Tide Pool 1</b><span id="xp-count">0 / 100 xp</span></div>
        <div class="track"><div class="fill" id="xp-fill"></div></div>
        <div class="gain" id="xp-gain"></div>
      </div>
      <div class="music" id="music">
        <div class="panel" id="panel">
          <div class="title" id="track-title">music</div>
          <div class="artist" id="track-artist"></div>
          <div class="controls">
            <button id="btn-prev" title="previous">⏮</button>
            <button id="btn-play" title="play or pause">▶</button>
            <button id="btn-next" title="next">⏭</button>
            <button id="btn-fx" class="on" title="click sounds on or off">fx</button>
            <span class="time" id="track-time">0:00 / 0:00</span>
          </div>
          <div class="row"><label>seek</label><input type="range" id="seek" min="0" max="1000" value="0"></div>
          <div class="row"><label>volume</label><input type="range" id="volume" min="0" max="100" value="40"></div>
          <div class="list" id="playlist"></div>
          <div class="mine"><span id="music-add" title="add songs from this computer">+ add your music</span><span id="music-folder" hidden title="show the music folder">open folder</span><input type="file" id="music-file" accept="audio/*" multiple hidden></div>
        </div>
        <div class="bubble" id="bubble" title="music"><div class="bars"><i></i><i></i><i></i></div></div>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="yt-player"></div>

  <script src="vendor/codemirror/codemirror.min.js"></script>
  <script src="vendor/codemirror/python.min.js"></script>
  <script type="module" src="game.js?v=1790476078"></script>
</body>
</html>
