<!DOCTYPE html>
<html>
  <head>
    <title>PyLevels</title>
    <link rel="stylesheet" href="{{ config.static.url }}css/xterm.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
    <script src="{{ config.static.url }}js/textual.js?v=3"></script>
    <style>
      :root { --accent: #8fe3ff; }
      html, body { margin: 0; height: 100%; background: #03132c; overflow: hidden; }
      /* xterm keeps a scrollbar track at the right; it showed as a white strip. */
      .xterm .xterm-viewport { scrollbar-width: none; background: transparent !important; }
      .xterm .xterm-viewport::-webkit-scrollbar { display: none; width: 0; }

      /* The real environment: a video if you drop one in, else a photo, else a painted sea. */
      .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
      .backdrop video, .backdrop img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: none;
      }
      .backdrop .painted {
        position: absolute; inset: -10%; width: 120%; height: 120%;
        background:
          radial-gradient(ellipse 70% 40% at 50% -5%, rgba(120, 220, 235, 0.45), transparent 70%),
          radial-gradient(ellipse 50% 35% at 20% 30%, rgba(40, 150, 190, 0.25), transparent 70%),
          linear-gradient(180deg, #0b5f86 0%, #073b66 40%, #041f44 75%, #02102a 100%);
        filter: blur(4px) saturate(1.1);
      }
      /* Sunlight rays: soft diagonal bands that drift slowly. */
      .backdrop .rays {
        position: absolute; inset: -20%; width: 140%; height: 140%;
        background: repeating-linear-gradient(112deg,
          transparent 0 140px, rgba(180, 235, 245, 0.10) 140px 200px,
          transparent 200px 360px, rgba(180, 235, 245, 0.06) 360px 400px);
        filter: blur(28px);
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.35) 45%, transparent 85%);
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.35) 45%, transparent 85%);
        animation: sway 26s ease-in-out infinite alternate;
      }
      @keyframes sway { from { transform: translateX(-3%) } to { transform: translateX(3%) } }
      /* Bubbles rising, made from a few soft dots. */
      .backdrop .bubbles {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(3px 3px at 12% 90%, rgba(255,255,255,0.55), transparent 70%),
          radial-gradient(2px 2px at 38% 70%, rgba(255,255,255,0.45), transparent 70%),
          radial-gradient(4px 4px at 64% 85%, rgba(255,255,255,0.4), transparent 70%),
          radial-gradient(2px 2px at 80% 60%, rgba(255,255,255,0.5), transparent 70%),
          radial-gradient(3px 3px at 90% 95%, rgba(255,255,255,0.45), transparent 70%),
          radial-gradient(2px 2px at 25% 50%, rgba(255,255,255,0.35), transparent 70%);
        background-size: 900px 700px, 700px 500px, 1100px 900px, 800px 600px, 1000px 800px, 600px 400px;
        animation: rise 40s linear infinite;
      }
      @keyframes rise { from { background-position: 0 0; } to { background-position: 0 -1400px; } }
      /* Sea life gliding across. Each is an SVG silhouette on its own path. */
      .life { position: absolute; left: 0; top: 0; fill: rgba(210, 236, 245, 0.55); filter: blur(0.6px) drop-shadow(0 0 12px rgba(160, 220, 240, 0.25)); }
      .life.dolphin { width: 260px; top: 22%; animation: swim-left 48s linear infinite; }
      .life.dolphin.second { width: 180px; top: 34%; animation: swim-left 63s linear 20s infinite; opacity: 0.7; }
      .life.turtle { width: 150px; top: 62%; animation: swim-right 90s linear 10s infinite; opacity: 0.6; }
      .life.fish { width: 60px; top: 48%; animation: swim-right 30s linear 5s infinite; opacity: 0.8; }
      .life.fish.two { top: 52%; width: 48px; animation: swim-right 32s linear 7s infinite; }
      .life.fish.three { top: 45%; width: 52px; animation: swim-right 29s linear 9s infinite; }
      .life.ray { width: 300px; top: 72%; animation: swim-left 110s linear 40s infinite; opacity: 0.45; }
      @keyframes swim-left {
        0%   { transform: translateX(110vw) translateY(0); }
        50%  { transform: translateX(45vw) translateY(-40px); }
        100% { transform: translateX(-30vw) translateY(10px); }
      }
      @keyframes swim-right {
        0%   { transform: translateX(-30vw) translateY(0) scaleX(1); }
        50%  { transform: translateX(45vw) translateY(24px) scaleX(1); }
        100% { transform: translateX(110vw) translateY(-10px) scaleX(1); }
      }
      /* A soft darkening so text stays readable over bright footage. */
      /* Space mode: the game says "space" in its status line, the page swaps the sea for stars. */
      #space { position: fixed; inset: 0; z-index: 0; display: none; background: radial-gradient(ellipse at 30% 65%, #2a1748 0%, #07061a 45%, #020209 100%); }
      body.space #space { display: block; }
      body.space #bg-video, body.space #bg-painted { display: none !important; }
      #space-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; display: none; }
      body.space.space-footage #space-video { display: block; }
      body.space.space-footage #space { display: none; }
      #space canvas { width: 100%; height: 100%; display: block; }
      .planet { position: absolute; border-radius: 50%; box-shadow: inset -18px -14px 40px rgba(0,0,0,0.75), 0 0 40px rgba(120,90,200,0.25); }
      .veil { position: fixed; inset: 0; z-index: 1;
        background: radial-gradient(ellipse 90% 80% at 50% 45%, rgba(2, 12, 34, 0.15), rgba(2, 12, 34, 0.55)); }

      .frame { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        opacity: 0; transform: scale(0.985); animation: surface 2.4s ease-out 1.8s forwards; }
      @keyframes surface { to { opacity: 1; transform: scale(1); } }
      .glass {
        position: relative;
        width: min(96vw, 1400px); height: min(94vh - 58px, 860px);
        margin-left: 0;
        border-radius: 18px;
        background: rgba(2, 12, 34, 0.42);
        backdrop-filter: blur(6px) saturate(1.05);
        -webkit-backdrop-filter: blur(6px) saturate(1.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.06);
        padding: 18px; box-sizing: border-box;
      }
      .textual-terminal { width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease-out; }
      body.-first-byte .textual-terminal { opacity: 1; }
      .xterm .xterm-viewport { background: transparent !important; }
      .xterm { font-family: 'JetBrains Mono', 'Roboto Mono', Menlo, monospace !important; }

      .dialog-container { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
      .intro { font: 16px 'JetBrains Mono', Menlo, monospace; color: rgba(255,255,255,0.9); text-align: center;
        padding: 32px 48px; border-radius: 14px; background: rgba(6, 9, 28, 0.6); backdrop-filter: blur(12px); }
      body.-first-byte .intro-dialog { display: none; }
      .closed-dialog { display: none; }
      body.-closed .closed-dialog { display: flex; }
      button { margin-top: 16px; padding: 10px 24px; border: 0; border-radius: 8px; background: var(--accent); color: #1a1408;
        font: 600 14px 'JetBrains Mono', Menlo, monospace; cursor: pointer; }
      #start { display: none; }
      #start.-delay { display: inline-block; }

      /* ---------- the dock under the frame: xp bar left, music right ---------- */
      .dock { width: min(96vw, 1400px); height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 0 6px; box-sizing: border-box; }

      /* ---------- music: one bubble, unfolds on click ---------- */
      #yt-player { position: fixed; right: -9999px; bottom: 0; width: 320px; height: 180px; opacity: 0; pointer-events: none; }
      .music { position: relative; z-index: 6; font: 12px 'JetBrains Mono', Menlo, monospace; color: #f4f9ff; }
      .bubble {
        width: 46px; height: 46px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        background: rgba(3, 18, 44, 0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: transform 0.2s, border-color 0.2s;
        margin-left: auto;
      }
      .bubble:hover { transform: scale(1.06); border-color: var(--accent); }
      .bubble .bars { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
      .bubble .bars i { width: 3px; height: 6px; background: var(--accent); border-radius: 2px; opacity: 0.6; }
      .music.playing .bubble .bars i { animation: eq 1.1s ease-in-out infinite; opacity: 1; }
      .music.playing .bubble .bars i:nth-child(2) { animation-delay: 0.2s; }
      .music.playing .bubble .bars i:nth-child(3) { animation-delay: 0.4s; }
      .music.playing .bubble { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); animation: pulse 2.6s ease-out infinite; }
      @keyframes eq { 0%, 100% { height: 5px; } 50% { height: 16px; } }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }

      .panel {
        display: none; position: absolute; right: 0; bottom: 58px; width: 300px; padding: 14px 16px; border-radius: 16px; box-sizing: border-box;
        background: rgba(3, 18, 44, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 16px 40px rgba(0,0,0,0.45);
        transform-origin: bottom right; animation: unfold 0.25s ease-out;
      }
      .music.open .panel { display: block; }
      @keyframes unfold { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
      .panel .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f4f9ff; }
      .panel .artist { color: #bcd9ea; font-size: 11px; margin: 2px 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .panel .buttons { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .panel button { background: rgba(255,255,255,0.06); color: #f4f9ff; border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px; padding: 6px 10px; margin: 0; font: inherit; cursor: pointer; }
      .panel button:hover { border-color: var(--accent); color: var(--accent); }
      .panel button.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
      .panel .time { margin-left: auto; color: #bcd9ea; font-size: 11px; }
      .panel input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
      .panel .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .panel .row label { color: #bcd9ea; font-size: 11px; width: 44px; flex: none; }
      .panel .list { max-height: 110px; overflow-y: auto; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
      .panel .list div { padding: 4px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #bcd9ea; }
      .panel .list div:hover { background: rgba(255,255,255,0.06); }
      .panel .list div.current { color: var(--accent); }
      .panel .hint { color: var(--accent); font-size: 11px; margin-top: 8px; }
      .panel .hint.hidden { display: none; }

      /* ---------- xp bar ---------- */
      .xp { position: relative; width: min(46vw, 520px); visibility: hidden;
        font: 12px 'JetBrains Mono', Menlo, monospace; color: #f4f9ff; }
      .xp.show { visibility: visible; animation: unfold 0.5s ease-out; }
      .xp.big .track { height: 16px; }
      .xp .name { display: flex; justify-content: space-between; margin-bottom: 6px; }
      .xp .name b { color: var(--accent); letter-spacing: 0.04em; }
      .xp .name span { color: #d3e6f3; }
      .xp .track { height: 12px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
      .xp.big .track { height: 18px; }
      .xp .fill { height: 100%; width: 0%; border-radius: 999px; transition: width 0.9s cubic-bezier(.4,0,.2,1), box-shadow 0.9s, background 0.9s;
        background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, #0b4a86), var(--accent));
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); position: relative; }
      .xp .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent 55%); border-radius: 999px; }
      /* every filled bar is a tier up: the glow grows and the fill turns whiter */
      .xp.tier-2 .fill { box-shadow: 0 0 14px var(--accent); }
      .xp.tier-3 .fill, .xp.tier-4 .fill { box-shadow: 0 0 18px var(--accent), 0 0 4px #fff; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #fff)); }
      .xp.tier-5 .fill, .xp.tier-6 .fill { box-shadow: 0 0 24px var(--accent), 0 0 8px #fff; background: linear-gradient(90deg, var(--accent), #fff); }
      .xp.tier-7 .fill, .xp.tier-8 .fill { box-shadow: 0 0 32px var(--accent), 0 0 12px #fff, 0 0 2px #fff; background: linear-gradient(90deg, #fff, var(--accent), #fff); animation: shine 2.5s linear infinite; background-size: 200% 100%; }
      @keyframes shine { from { background-position: 0% 0; } to { background-position: 200% 0; } }
      .xp .gain { position: absolute; right: -52px; top: 14px; color: var(--accent); font-weight: 700; opacity: 0; transition: opacity 0.3s; }
      .xp .gain.show { opacity: 1; }
    </style>
    <script>
      function getStartUrl() {
        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        params.delete("delay");
        return url.pathname + "?" + params.toString();
      }
      async function refresh() {
        const ping_url = document.body.dataset.pingurl;
        if (ping_url) { await fetch(ping_url, { method: "GET", mode: "no-cors" }); }
        window.location.href = getStartUrl();
      }
      // Show the first background that exists: scene.mp4, then scene.jpg, then the painted sea.
      function pickBackdrop() {
        const video = document.getElementById("bg-video");
        const photo = document.getElementById("bg-photo");
        const painted = document.getElementById("bg-painted");
        video.onerror = () => {
          photo.onload = () => { painted.style.display = "none"; photo.style.display = "block"; };
          photo.src = "{{ config.static.url }}background/scene.jpg";
        };
        video.oncanplay = () => { painted.style.display = "none"; video.style.display = "block"; video.playbackRate = 0.5; };
        const spaceVideo = document.getElementById("space-video");
        spaceVideo.oncanplay = () => { document.body.classList.add("space-footage"); spaceVideo.playbackRate = 0.6; };
        spaceVideo.onerror = () => { document.body.classList.remove("space-footage"); };
        video.src = "{{ config.static.url }}background/scene.mp4";
      }
      window.addEventListener("DOMContentLoaded", pickBackdrop);
    </script>
  </head>

        <div class="painted"></div>

           src="{{ config.static.url }}background/space.mp4"></video>

      <div class="planet" style="left: 12%; top: 62%; width: 70px; height: 70px; background: radial-gradient(circle at 35% 30%, #9fd0ff, #2f6aa8 60%, #0f2a4a);"></div>

    <!-- Background music: YouTube's own player, hidden, driven by the bubble below.
         Add songs in static/playlist.json. -->
    <div id="yt-player"></div>

    <!-- The XP tanks: one glass asset in two sizes. The game says which screen is showing. -->

    <script>
      // ---------- music player: local files first, YouTube as well ----------
      // A track is {title, artist, file} for an mp3 in static/music, or
      // {title, artist, url} for a YouTube link. Edit static/playlist.json.
      const music = { yt: null, ytReady: false, audio: new Audio(), tracks: [], index: 0, loop: true, userPaused: false, timer: null };
      music.audio.preload = "auto";

      function videoId(url) {
        const match = url.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/);
        return match ? match[1] : url;
      }
      function formatTime(seconds) {
        seconds = Math.max(0, Math.floor(seconds || 0));
        return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
      }
      function savedVolume() {
        const v = parseInt(localStorage.getItem("pylevels-volume") || "40", 10);
        return isNaN(v) ? 40 : v;
      }
      function current() { return music.tracks[music.index]; }
      function isFile() { return current() && current().file; }

      async function loadPlaylist() {
        const response = await fetch("{{ config.static.url }}playlist.json", { cache: "no-store" });
        const data = await response.json();
        music.tracks = data.tracks || [];
        const list = document.getElementById("playlist");
        list.innerHTML = "";
        music.tracks.forEach((track, i) => {
          const row = document.createElement("div");
          row.textContent = (i + 1) + ". " + track.title + (track.file ? "" : "  (youtube)");
          row.onclick = () => { music.userPaused = false; playTrack(i); };
          list.appendChild(row);
        });
        showTrack();
      }

      function showTrack() {
        const track = current();
        document.getElementById("track-title").textContent = track ? track.title : "no tracks";
        document.getElementById("track-artist").textContent = track ? (track.artist || "") : "";
        document.querySelectorAll("#playlist div").forEach((row, i) => row.classList.toggle("current", i === music.index));
      }

      function setPlaying(playing) {
        document.getElementById("music").classList.toggle("playing", playing);
        document.getElementById("btn-play").textContent = playing ? "⏸" : "▶";
        if (playing) document.getElementById("player-hint").classList.add("hidden");
      }

      function stopOther() {
        // Only one backend plays at a time.
        if (isFile()) { if (music.ytReady) music.yt.pauseVideo(); }
        else { music.audio.pause(); }
      }

      function playTrack(i) {
        if (!music.tracks.length) return;
        music.index = (i + music.tracks.length) % music.tracks.length;
        showTrack();
        stopOther();
        if (isFile()) {
          music.audio.src = "{{ config.static.url }}" + current().file;
          music.audio.volume = savedVolume() / 100;
          music.audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
        } else if (music.ytReady) {
          music.yt.loadVideoById(videoId(current().url));
          music.yt.playVideo();
        }
      }

      function isPlaying() {
        if (isFile()) return !music.audio.paused && !music.audio.ended && music.audio.src;
        return music.ytReady && music.yt.getPlayerState() === YT.PlayerState.PLAYING;
      }

      function resume() {
        if (isFile()) {
          if (!music.audio.src) playTrack(music.index);
          else music.audio.play().then(() => setPlaying(true)).catch(() => {});
        } else if (music.ytReady) {
          const state = music.yt.getPlayerState();
          if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) music.yt.playVideo();
          else playTrack(music.index);
        }
      }

      function togglePlay() {
        if (isPlaying()) {
          music.userPaused = true;
          if (isFile()) { music.audio.pause(); setPlaying(false); } else music.yt.pauseVideo();
        } else {
          music.userPaused = false;
          resume();
        }
      }

      // Browsers only allow sound after you click or type. So on every click
      // or key, if the music is not playing and you did not pause it, start it.
      function nudgeMusic() {
        if (music.userPaused || !music.tracks.length || isPlaying()) return;
        resume();
      }

      function tick() {
        let duration = 0, now = 0;
        if (isFile()) { duration = music.audio.duration || 0; now = music.audio.currentTime || 0; }
        else if (music.ytReady) { duration = music.yt.getDuration(); now = music.yt.getCurrentTime(); }
        document.getElementById("track-time").textContent = formatTime(now) + " / " + formatTime(duration);
        if (duration > 0 && document.activeElement.id !== "seek") {
          document.getElementById("seek").value = Math.round(now / duration * 1000);
        }
      }

      function onYouTubeIframeAPIReady() {
        music.yt = new YT.Player("yt-player", {
          width: 320, height: 180,
          playerVars: { controls: 0, disablekb: 1, rel: 0, playsinline: 1 },
          events: {
            onReady: () => { music.ytReady = true; music.yt.setVolume(savedVolume()); },
            onStateChange: (event) => {
              if (isFile()) return;
              setPlaying(event.data === YT.PlayerState.PLAYING);
              if (event.data === YT.PlayerState.ENDED) nextTrack();
            },
            onError: () => nextTrack(),
          },
        });
      }

      function nextTrack() {
        const last = music.index === music.tracks.length - 1;
        if (!last || music.loop) playTrack(music.index + 1);
      }

      window.addEventListener("DOMContentLoaded", async () => {
        await loadPlaylist();
        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(script);
        music.audio.onended = nextTrack;
        music.audio.onplay = () => setPlaying(true);
        music.audio.onpause = () => setPlaying(false);
        music.timer = setInterval(tick, 500);
        document.getElementById("volume").value = savedVolume();

        // Only a real click may pause: scripted events are ignored.
        document.getElementById("btn-play").onclick = (e) => { if (e.isTrusted) togglePlay(); };
        document.getElementById("btn-prev").onclick = () => { music.userPaused = false; playTrack(music.index - 1); };
        document.getElementById("btn-next").onclick = () => { music.userPaused = false; playTrack(music.index + 1); };
        document.getElementById("btn-loop").onclick = (e) => { music.loop = !music.loop; e.target.classList.toggle("on", music.loop); };
        document.getElementById("volume").oninput = (e) => {
          const v = parseInt(e.target.value, 10);
          music.audio.volume = v / 100;
          if (music.ytReady) music.yt.setVolume(v);
          localStorage.setItem("pylevels-volume", e.target.value);
        };
        document.getElementById("seek").onchange = (e) => {
          const part = e.target.value / 1000;
          if (isFile()) music.audio.currentTime = (music.audio.duration || 0) * part;
          else if (music.ytReady) music.yt.seekTo(music.yt.getDuration() * part, true);
        };
        document.getElementById("bubble").onclick = (e) => {
          e.stopPropagation();
          document.getElementById("music").classList.toggle("open");
        };
        document.getElementById("panel").onclick = (e) => e.stopPropagation();
        document.getElementById("btn-fx").onclick = (e) => {
          fx.on = !fx.on;
          e.target.classList.toggle("on", fx.on);
          localStorage.setItem("pylevels-fx", fx.on ? "1" : "0");
        };
        document.addEventListener("pointerdown", (e) => {
          if (!document.getElementById("music").contains(e.target)) document.getElementById("music").classList.remove("open");
          nudgeMusic();
        });
        document.addEventListener("keydown", nudgeMusic);
        nudgeMusic();
      });

      // ---------- sound effects: bubbles on clicks, a dolphin on a pass ----------
      // Made with the browser's own synthesizer, no sound files needed.
      const fx = { ctx: null, on: localStorage.getItem("pylevels-fx") !== "0" };
      function fxContext() {
        if (!fx.ctx) fx.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (fx.ctx.state === "suspended") fx.ctx.resume();
        return fx.ctx;
      }
      function tone(fromHz, toHz, seconds, volume, type) {
        if (!fx.on) return;
        const ctx = fxContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(fromHz, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(toHz, ctx.currentTime + seconds);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + seconds);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + seconds);
      }
      function bubble() { tone(300 + Math.random() * 200, 900 + Math.random() * 400, 0.12, 0.12); }
      function dolphin() {
        tone(1400, 3200, 0.16, 0.07);
        setTimeout(() => tone(2600, 1800, 0.14, 0.06), 150);
        setTimeout(() => tone(1900, 3600, 0.2, 0.06), 300);
      }
      document.addEventListener("pointerdown", bubble, { capture: true });
      window.addEventListener("DOMContentLoaded", () => { document.getElementById("btn-fx").classList.toggle("on", fx.on); });
    </script>

    <script>
      // ---------- accent colour and the XP tanks, read from the game's files ----------
      const XP_PER_TANK = 100;

      const TANK_NAMES = ["Tide Pool", "Shallows", "Reef", "Kelp Forest", "Open Sea", "Twilight Zone", "Abyss", "Trench"];

      let lastXp = null;
      function drawBar(xp) {
        const tank = Math.floor(xp / XP_PER_TANK) + 1;
        const into = xp % XP_PER_TANK;
        const name = TANK_NAMES[Math.min(tank, TANK_NAMES.length) - 1];
        const bar = document.getElementById("xp");
        bar.className = bar.className.replace(/tier-\d+/g, "").trim() + " tier-" + Math.min(tank, 8);
        document.getElementById("xp-fill").style.width = (into / XP_PER_TANK * 100).toFixed(1) + "%";
        document.getElementById("xp-name").textContent = name + " " + tank;
        document.getElementById("xp-count").textContent = into + " / " + XP_PER_TANK + " xp";
        if (lastXp !== null && xp > lastXp) {
          const gain = document.getElementById("xp-gain");
          gain.textContent = "+" + (xp - lastXp);
          gain.classList.add("show");
          clearTimeout(gain.hideTimer);
          gain.hideTimer = setTimeout(() => gain.classList.remove("show"), 1800);
          if (xp - lastXp >= 10) dolphin();
        }
        lastXp = xp;
      }

      // Each world opens on its own song. The playlist marks tracks with a world.
      let lastWorld = null;
      function hasStatusLine(top) { return /xp\s+\d+/.test(top); }
      function songForWorld(world) {
        if (!world || world === lastWorld || !music.tracks.length) return;
        lastWorld = world;
        const index = music.tracks.findIndex(t => t.world === world);
        if (index >= 0 && index !== music.index) { music.userPaused = false; playTrack(index); }
      }

      function readState() {
        // Read this page's own terminal: the status line holds the live XP,
        // and the second line says which screen is showing.
        const term = window.pylevelsTerminal;
        if (!term) return;
        const line = (n) => (term.buffer.active.getLine(n) || { translateToString: () => "" }).translateToString();
        const top = line(0), second = line(1);
        const inSpace = top.includes("space");
        document.body.classList.toggle("space", inSpace);
        songForWorld(hasStatusLine(top) ? (inSpace ? "space" : "sea") : null);
        const xpMatch = top.match(/xp\s+(\d+)/);
        const onOverview = second.includes("your dive so far");
        const onSettings = second.includes("settings");
        const hasStatus = xpMatch !== null;
        const bar = document.getElementById("xp");
        bar.classList.toggle("show", hasStatus && !onSettings);
        bar.classList.toggle("big", onOverview);
        if (xpMatch) drawBar(parseInt(xpMatch[1], 10));
      }
      const ACCENTS = { ice: "#8fe3ff", aqua: "#5ee6c8", pearl: "#eef6ff", lavender: "#c9a7ff",
                        mint: "#b8f0c8", coral: "#ff9a86", rose: "#ff9ad0" };

      async function readProgress() {
        try {
          const response = await fetch("{{ config.static.url }}progress.json", { cache: "no-store" });
          if (!response.ok) return;
          const data = await response.json();
          document.documentElement.style.setProperty("--accent", ACCENTS[data.accent] || ACCENTS.ice);

        } catch (error) { /* no progress file yet, the tank simply stays empty */ }
      }

      // ---------- ctrl+enter (or cmd+enter) runs the code ----------
      // Terminals send a plain enter for ctrl+enter, so the page catches the key
      // itself and sends the game its F5 key, which also means "run".
      function hookRunKey() {
        const term = window.pylevelsTerminal;
        if (!term) { setTimeout(hookRunKey, 200); return; }
        // ctrl (or cmd) + key -> the F key the game binds to the same action.
        const KEYS = { Enter: "\x1b[15~", h: "\x1bOP", g: "\x1bOQ", t: "\x1bOR", y: "\x1bOS", n: "\x1b[17~" };
        term.attachCustomKeyEventHandler((event) => {
          if (event.type !== "keydown" || !(event.ctrlKey || event.metaKey)) return true;
          const sequence = KEYS[event.key.length === 1 ? event.key.toLowerCase() : event.key];
          if (!sequence) return true;
          term.input(sequence, true);
          return false;
        });
      }
      hookRunKey();

      // ---------- the starfield, drawn on a canvas, drifting slowly ----------
      const spaceCanvas = document.getElementById("space-canvas");
      const spaceStars = Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), size: Math.random() * 1.6 + 0.4, speed: Math.random() * 0.00004 + 0.00001, phase: Math.random() * 6.28 }));
      function drawSpace(time) {
        if (document.body.classList.contains("space")) {
          const ctx = spaceCanvas.getContext("2d");
          spaceCanvas.width = spaceCanvas.clientWidth; spaceCanvas.height = spaceCanvas.clientHeight;
          for (const star of spaceStars) {
            star.x -= star.speed; if (star.x < 0) star.x = 1;
            const glow = 0.55 + 0.45 * Math.sin(time / 900 + star.phase);
            ctx.fillStyle = "rgba(230,236,255," + glow.toFixed(2) + ")";
            ctx.beginPath(); ctx.arc(star.x * spaceCanvas.width, star.y * spaceCanvas.height, star.size, 0, 6.28); ctx.fill();
          }
        }
        requestAnimationFrame(drawSpace);
      }
      requestAnimationFrame(drawSpace);

      window.addEventListener("DOMContentLoaded", () => {
        readProgress(); setInterval(readProgress, 2000);
        readState(); setInterval(readState, 150);
      });
    </script>
  </body>
</html>
